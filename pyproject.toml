[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-intel"
version = "0.1.0"
description = "Büyük ölçekli film veri setlerini bellek dostu şekilde birleştirir ve vizyon reytingi tahmin eder."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shico" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
movie-intel = "movie_intel.cli:app"

[tool.setuptools.packages.find]
include = ["movie_intel*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
